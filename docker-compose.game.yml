# wiki-race, the Rust game server.
#
# Separate from docker-compose.yml, which runs the Python Panel/Datashader
# viewer. Different language, different image, different data needs — they
# share nothing but the repo.
#
# This file assumes you ALREADY run Traefik and it watches a docker network.
# It brings no proxy of its own; it just joins that network and carries the
# routing labels.
#
#   RACE_HOST=race.example.com docker compose -f docker-compose.game.yml up -d --build
#
# Environment (a .env file next to this one works):
#   RACE_HOST         required — the hostname Traefik should route
#   TRAEFIK_NETWORK   the external network Traefik watches (default: traefik)
#   ENTRYPOINT        Traefik's https entrypoint name    (default: websecure)
#   DATA_DIR          where the parquet lives            (default: ./data)
#   CERT_RESOLVER     only for a public deploy — see the certresolver label
#
# Local wildcard setup (*.local.example.com), which is what this defaults to:
#   RACE_HOST=race.local.example.com
#   TRAEFIK_NETWORK=traefik
#   ENTRYPOINT=websecure

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.game
    restart: unless-stopped
    # --trust-proxy is REQUIRED behind Traefik: without it every request
    # appears to come from Traefik's container IP, so the per-IP rate limiter
    # throttles all users as a single bucket. It is also why the host port
    # below is bound to loopback — on a public port, any client could forge
    # X-Forwarded-For and defeat rate limiting entirely.
    command:
      - sh
      - -c
      - exec serve --data /data --host 0.0.0.0 --port 8080 --trust-proxy --secure-cookies
    volumes:
      # THE DATA IS NOT IN GIT. `data/` is gitignored (and .dockerignore'd —
      # data/dumps alone is 26 GB and must never enter a build context), so a
      # fresh clone has no data and this mount would silently create an empty
      # directory. The container then exits with "missing parser output in
      # /data" and, thanks to restart: unless-stopped, does so in a loop.
      # Copy the parquet to the host first:
      #
      #   rsync -avP data/{titles,edges,redirects,nodes}.parquet \
      #         SERVER:/opt/wiki-graph/data/
      #
      # titles + edges are required. redirects (alias search) and nodes (the
      # map) are optional — the service degrades gracefully without them.
      - ${DATA_DIR:-./data}:/data:ro
      # The HMAC secret backing the signed identity cookie and the append-only
      # leaderboard live here. Losing this volume invalidates every existing
      # player cookie and takes the leaderboard with it.
      - state:/app
    ports:
      # Loopback only: reachable for `curl localhost:8080/api/meta` on the host,
      # not from the internet. Public traffic arrives via Traefik with TLS. Do
      # not change this to "8080:8080" while --trust-proxy is set.
      - "127.0.0.1:8080:8080"
    networks:
      - proxy

    # ---- No Traefik? -----------------------------------------------------
    # To publish directly instead — on a LAN, or behind a proxy you configure
    # yourself — make these four changes:
    #
    #   1. ports:      - "8080:8080"        (or "${PORT:-8080}:8080")
    #   2. command:    drop --trust-proxy AND --secure-cookies
    #   3. networks:   delete the `networks:` key here and the top-level
    #                  `networks:` block, so compose uses its default bridge
    #   4. labels:     harmless to leave; Traefik is not watching
    #
    # Both command flags must go, and for different reasons. Keeping
    # --trust-proxy on a directly-published port lets any client forge
    # X-Forwarded-For and bypass the per-IP rate limiter entirely. Keeping
    # --secure-cookies over plain http means the browser never sends the
    # identity cookie back, so every request looks like a new player and the
    # leaderboard silently stops attributing runs.
    #
    # LAN note: binding 8080 on all interfaces exposes an unauthenticated
    # service to your whole network. That is fine for testing at home and not
    # fine on untrusted wifi.
    # ----------------------------------------------------------------------
    labels:
      - traefik.enable=true
      - traefik.http.routers.wikirace.rule=Host(`${RACE_HOST}`)
      - traefik.http.routers.wikirace.entrypoints=${ENTRYPOINT:-websecure}
      # tls=true with no certresolver: serve whatever certificate Traefik
      # already holds for this host. That is what a pre-loaded wildcard
      # (*.local.example.com) needs — pointing an ACME resolver at a LAN
      # hostname makes Traefik attempt a challenge that cannot succeed.
      - traefik.http.routers.wikirace.tls=true
      # PUBLIC DEPLOY: uncomment this and set CERT_RESOLVER to your ACME
      # resolver name, or Traefik serves its self-signed default certificate
      # and every visitor gets a browser warning.
      # - traefik.http.routers.wikirace.tls.certresolver=${CERT_RESOLVER:-le}
      - traefik.http.services.wikirace.loadbalancer.server.port=8080
      # Explicit, because Traefik guesses wrong when a container is attached to
      # more than one network.
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
    # Loading 231.7M edges into CSR needs ~4 GB and about a minute. Without a
    # limit a memory spike takes the host down instead of the container.
    deploy:
      resources:
        limits:
          memory: 6g

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  state:
