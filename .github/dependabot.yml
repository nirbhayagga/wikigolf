# Dependabot: version updates disabled (open-pull-requests-limit: 0).
#
# Why: this repo is push-mirrored to GitHub from Forgejo. A push mirror is a
# `git push --mirror`, which prunes any ref not present upstream. dependabot/*
# branches only ever exist on GitHub, so every sync deletes them — and deleting
# a PR's head branch makes GitHub auto-close it (observed 24 Aug 2026: three
# PRs, closed within a minute). The sync is not only push-triggered; the
# mirror's own interval does it too, so there is no safe window.
#
# What still works: Dependabot ALERTS are a repo setting, not this file, and
# are not branches — the mirror cannot touch them; that is the real signal.
# SECURITY UPDATES are also a repo setting and their PRs are NOT bounded by
# the limit below; they are branches, so they get pruned too — turn them off
# under Settings -> Code security for zero branches; the alert itself names
# the fixed version range.
#
# What replaces it: updates applied by hand, in batches, in the private repo,
# arriving here with the next mirror refresh. For peer-locked toolchains that
# is better anyway — packages that must move together cannot be split into
# per-package PRs that each pass CI.
#
# Proper fix, later: Renovate as a scheduled Forgejo Action. It opens PRs on
# Forgejo (the source of truth), so the mirror carries them outward in the
# direction that already works.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups: { cargo: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /python
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups: { pip: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups: { actions: { patterns: ["*"] } }
