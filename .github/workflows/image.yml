# Build the game server image and publish it to GHCR on every push to main.
#
# Runs on the PUBLIC GitHub mirror (pushes arriving via the Forgejo push
# mirror trigger it like any other push). Free for public repos. The image
# is the serve binary only — data is mounted at runtime, never baked in.
#
# One-time after the first run: the package appears PRIVATE by default.
# Make it public (GitHub -> your profile -> Packages -> wikigolf ->
# Package settings -> Change visibility) or anonymous `docker pull` fails.
#
# Consume on the VM:  IMAGE=ghcr.io/<user>/wikigolf:latest in .env, then
#   docker compose -f docker-compose.game.yml pull && ... up -d

name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` on main, plus the short commit sha so a VM can pin
      # a known-good build and roll back by tag.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # The gha cache keeps the cargo dependency layer warm between runs,
      # so a code-only push rebuilds in a few minutes instead of ~15.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.game
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
