# wiki-race behind Traefik, with automatic Let's Encrypt certificates.
#
#   docker compose -f docker-compose.game.yml up -d --build
#
# Set RACE_HOST and ACME_EMAIL first (a .env file next to this one works):
#   RACE_HOST=race.example.com
#   ACME_EMAIL=you@example.com
#
# For a purely local test with no domain and no TLS, run the game service
# alone and skip Traefik entirely:
#   docker compose -f docker-compose.game.yml up -d --build game
#   curl localhost:8080/api/meta
# (the game service publishes 8080 on the host for exactly this case).

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Containers are not exposed unless they say so. Without this, every
      # container on the host would get a route.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to watch for container events, and a
      # writable docker socket in a container is a host root escalation.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  game:
    build:
      context: .
      dockerfile: Dockerfile.game
    restart: unless-stopped
    # --trust-proxy is REQUIRED behind Traefik and DANGEROUS without it.
    # Without it every request appears to come from the proxy's container IP,
    # so the per-IP rate limiter throttles all users as one bucket. With it on
    # a directly-exposed port, any client can forge X-Forwarded-For and defeat
    # rate limiting entirely. Drop both this flag and --secure-cookies if you
    # run the `game` service on its own for a local test.
    command:
      - sh
      - -c
      - exec serve --data /data --host 0.0.0.0 --port 8080 --trust-proxy --secure-cookies
    volumes:
      # The parquet is read-only to the service and ~1.3 GB, so it is mounted
      # rather than baked into the image.
      - ./data:/data:ro
      # The HMAC secret for the signed identity cookie and the append-only
      # leaderboard live here. Losing this volume invalidates every existing
      # player cookie and the leaderboard with it.
      - state:/app
    ports:
      # Published for the no-Traefik local case. Remove this once Traefik is
      # fronting it, or the port bypasses TLS and the rate-limit assumptions
      # above stop holding.
      - "8080:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.wikirace.rule=Host(`${RACE_HOST}`)
      - traefik.http.routers.wikirace.entrypoints=websecure
      - traefik.http.routers.wikirace.tls.certresolver=le
      - traefik.http.services.wikirace.loadbalancer.server.port=8080
    # Loading 231.7M edges into CSR needs ~4 GB and about a minute. Without a
    # limit a memory spike takes the host down instead of the container.
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  letsencrypt:
  state:
