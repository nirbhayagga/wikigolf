# Rust and Python checks plus browser regression tests of current sources
# against a tiny fixture. Scheduled runs also monitor the deployed site.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyflakes numpy
      - run: python -m pyflakes python/*.py tools/*.py
      - run: python -m unittest discover -s python/tests

  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: e2e } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*.unit.cjs
      - run: npx playwright test
      - run: npx playwright test
        if: github.event_name == 'schedule'
        env: { BASE_URL: "https://wikigolf.app" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  lighthouse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
